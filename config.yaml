# ──────────────────────────────────────────────
#  Local LLM — Chat Configuration
# ──────────────────────────────────────────────

model:
  path: models/Gemma-4-E2B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
  gpu_layers: 99
  ctx: 8192
  flash_attn: true

inference:
  max_tokens: 1024
  temperature: 0.1
  top_p: 0.95
  top_k: 40
  repeat_penalty: 1.05
  n_batch: 256

session:
  system_prompt: "You are a helpful assistant."
  verbose: false
  auto_save: null

web:
  host: "127.0.0.1"
  port: 7860
  share: false
  theme:
    primary_hue: "cyan"
    secondary_hue: "slate"
  title: "Local LLM"
  description: ""